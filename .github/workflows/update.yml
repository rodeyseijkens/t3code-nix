name: Auto Update

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update packages
        run: ./update.sh

      - name: Test build
        run: |
          if git diff --quiet versions.nix; then
            echo "No version changes to build"
            exit 0
          fi
          nix build .#t3code .#t3code-nightly --accept-flake-config --impure

      - name: Commit and push
        run: |
          if git diff --quiet versions.nix; then
            echo "Already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add versions.nix
          git commit -m "Update t3code stable and nightly versions"
          git push

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STABLE=$(sed -n '/stable = {/,/};/p' versions.nix \
            | sed -n 's/.*version = "\(.*\)";/\1/p')
          NIGHTLY=$(sed -n '/nightly = {/,/};/p' versions.nix \
            | sed -n 's/.*version = "\(.*\)";/\1/p')

          if gh release view "v$STABLE" >/dev/null 2>&1; then
            echo "Release v$STABLE already exists"
            exit 0
          fi

          gh release create "v$STABLE" \
            --title "t3code $STABLE" \
            --notes "Updated t3code to stable $STABLE (nightly: $NIGHTLY)."
